AWSTemplateFormatVersion: '2010-09-09'
Description: Root template for nested stacks VPC and EC2
Parameters:
  EnvId:
    Type: String
    Default: project
    Description: Environment name tag/prefix
Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/infra-backend-infrabackendbucket-hash-s3-aqui/7d10f4571b162ab6ea7ece787cb2a459.template
      Parameters:
        Environment:
          Ref: EnvId
  EC2Stack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/infra-backend-infrabackendbucket-hash-s3-aqui/99cab71311770d2b17e801e9fb7d9105.template
      Parameters:
        Environment:
          Ref: EnvId
Outputs:
  VPCId:
    Value:
      Fn::GetAtt:
      - VPCStack
      - Outputs.VpcId
  EC2PublicIp:
    Value:
      Fn::GetAtt:
      - EC2Stack
      - Outputs.InstancePublicIp
